      <circle cx="14" cy="83" r="12" fill="#e5deed" stroke="#715e8a"/><text x="38" y="88">Anomaly detection</text>
      <circle cx="14" cy="144" r="12" fill="#d8ece7" stroke="#087d79"/><text x="38" y="149">Cavity identification</text>
      <circle cx="14" cy="205" r="12" fill="#e5deed" stroke="#715e8a"/><text x="38" y="210">Fault identification</text>
    </g>
  </g>

  <text x="1130" y="590" text-anchor="end" fill="#6a7c7e" font-family="Helvetica Neue, Arial, sans-serif" font-size="12">Los Alamos National Laboratory</text>
