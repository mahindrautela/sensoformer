    <text x="510" y="493" text-anchor="middle" fill="#b9d8d2" font-family="Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.3">SHARED SENSOR SPACE</text>
    <text x="510" y="537" text-anchor="middle" fill="#ffffff" font-family="Georgia, Times New Roman, serif" font-size="34">SensOFormer</text>
    <g transform="translate(438 552)" fill="#ffffff" fill-opacity=".17" stroke="#ffffff" stroke-opacity=".35">
      <rect width="33" height="15" rx="3"/><rect x="40" width="33" height="15" rx="3"/><rect x="80" width="33" height="15" rx="3"/><rect x="120" width="23" height="15" rx="3"/>
    </g>
  </g>

  <g fill="none" stroke="#715e8a" stroke-width="2" stroke-dasharray="7 7" opacity=".75">
    <path d="M635 486c37 0 38-52 74-52"/><path d="M635 513c37 0 38-18 74-18"/><path d="M635 539c37 0 38 18 74 18"/><path d="M635 566c37 0 38 52 74 52"/>
