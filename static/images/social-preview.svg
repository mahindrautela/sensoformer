<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f5ee"/>
      <stop offset="0.7" stop-color="#f1eee6"/>
      <stop offset="1" stop-color="#e2ece7"/>
    </linearGradient>
    <linearGradient id="model" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102f39"/>
      <stop offset="1" stop-color="#235d67"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#102f39" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity=".42" stroke="#b9cbc5" stroke-width="1">
    <path d="M0 90h1200M0 180h1200M0 270h1200M0 360h1200M0 450h1200M0 540h1200"/>
    <path d="M90 0v630M180 0v630M270 0v630M360 0v630M450 0v630M540 0v630M630 0v630M720 0v630M810 0v630M900 0v630M990 0v630M1080 0v630"/>
  </g>

  <g font-family="Helvetica Neue, Arial, sans-serif">
    <rect x="70" y="59" width="209" height="34" rx="17" fill="#ffffff" fill-opacity=".68" stroke="#95b6ad"/>
    <circle cx="90" cy="76" r="5" fill="#087d79"/>
    <text x="106" y="81" fill="#075c5c" font-size="13" font-weight="700" letter-spacing="1.4">NEURIPS 2026 · ACCEPTED</text>
    <text x="70" y="142" fill="#c9694d" font-size="15" font-weight="700" letter-spacing="2.4">SENSOFORMER</text>
