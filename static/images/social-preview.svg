    <text x="66" y="286" font-size="62" font-style="italic" fill="#075c5c">Particle Accelerators</text>
  </g>

  <text x="70" y="337" fill="#38545a" font-family="Helvetica Neue, Arial, sans-serif" font-size="20">A shared representation for heterogeneous sensor telemetry</text>
  <text x="70" y="367" fill="#38545a" font-family="Helvetica Neue, Arial, sans-serif" font-size="20">and operational diagnostics.</text>

  <g transform="translate(70 440)" font-family="Helvetica Neue, Arial, sans-serif">
