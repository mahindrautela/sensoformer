    <g fill="#102f39" font-size="13" font-weight="700">
      <text x="0" y="15">LANL</text><text x="0" y="51">CERN</text><text x="0" y="87">ORNL</text><text x="0" y="123">SLAC</text><text x="0" y="159">JLAB</text>
    </g>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5">
      <path d="M58 10h21l7-12 9 24 8-12h39" stroke="#c9694d"/>
      <path d="M58 46h17l7-8 8 16 9-8h43" stroke="#715e8a"/>
      <path d="M58 82h19l6-14 9 28 8-14h42" stroke="#087d79"/>
      <path d="M58 118h21l7-10 8 20 8-10h40" stroke="#c9694d"/>
      <path d="M58 154h17l7-12 9 24 8-12h43" stroke="#715e8a"/>
    </g>
  </g>

  <g opacity=".75" fill="none" stroke="#709b93" stroke-width="2" stroke-dasharray="7 7">
    <path d="M286 462c45 0 55 59 100 71"/>
    <path d="M286 498c45 0 56 38 100 43"/>
    <path d="M286 534c45 0 56 11 100 11"/>
    <path d="M286 570c45 0 56-16 100-16"/>
    <path d="M286 606c45 0 56-45 100-45"/>
